# Tmux-style keys: press Ctrl+B, release both keys, then press the command key.
# Kitty windows act as panes; Kitty tabs act as tmux windows.
# Existing Kitty shortcuts (including copy/paste) remain available.

# Start new tabs with a layout that supports arbitrary nested splits.
enabled_layouts splits,stack
# Match tmux's default zero-based window numbering (0 through 9).
tab_title_template "{index - 1}: {title}"

# New panes inherit the active pane's directory. Return from zoom before splitting.
map ctrl+b>% combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+b>" combine : goto_layout splits : launch --location=hsplit --cwd=current

# Pane focus, zoom, close (with confirmation), and resizing.
map ctrl+b>left neighboring_window left
map ctrl+b>right neighboring_window right
map ctrl+b>up neighboring_window up
map ctrl+b>down neighboring_window down
map ctrl+b>o next_window
map ctrl+b>semicolon nth_window -1
map ctrl+b>z toggle_layout stack
map ctrl+b>x close_window_with_confirmation
# Move the nearest divider on that axis in the arrow's direction, from either pane.
map ctrl+b>ctrl+left kitten move_divider.py left
map ctrl+b>ctrl+right kitten move_divider.py right
map ctrl+b>ctrl+up kitten move_divider.py up
map ctrl+b>ctrl+down kitten move_divider.py down

# Tabs correspond to tmux windows. New tabs inherit the current directory.
map ctrl+b>c new_tab_with_cwd
map ctrl+b>n next_tab
map ctrl+b>p previous_tab
map ctrl+b>l goto_tab -1
map ctrl+b>comma set_tab_title
map ctrl+b>w select_tab
map ctrl+b>0 goto_tab 1
map ctrl+b>1 goto_tab 2
map ctrl+b>2 goto_tab 3
map ctrl+b>3 goto_tab 4
map ctrl+b>4 goto_tab 5
map ctrl+b>5 goto_tab 6
map ctrl+b>6 goto_tab 7
map ctrl+b>7 goto_tab 8
map ctrl+b>8 goto_tab 9
map ctrl+b>9 goto_tab 10

# Scrollback opens in Kitty's pager; press q to leave the default pager (less).
map ctrl+b>[ show_scrollback
# Local convenience shortcut to reload the configuration.
map ctrl+b>r load_config_file
# Cancel a prefix, or send a literal Ctrl+B to the application (including tmux).
map ctrl+b>escape discard_event
map ctrl+b>ctrl+b send_text all \x02
